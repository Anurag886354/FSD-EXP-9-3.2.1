version: "3.8"

services:
  react-app:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
    ports:
      - "8080:8080"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost/api}
    restart: unless-stopped
    container_name: react-app-prod
